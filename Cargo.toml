[package]
name = "slideforge"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crc32c = "0.6.8"
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
jpeg-decoder = "0.3.2"
log = "0.4.28"
printpdf = { version = "0.12.5", default-features = false, features = ["images"] }
rayon = "1.12.0"
thiserror = "2.0.19"
tiff = "0.11.3"
